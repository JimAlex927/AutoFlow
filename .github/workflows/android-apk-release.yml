name: Android APK Release
run-name: Android APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install required packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOFLOW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AUTOFLOW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOFLOW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOFLOW_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing AutoFlow release-signing secrets." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autoflow-release.jks"

      - name: Build release APK
        env:
          AUTOFLOW_KEYSTORE_FILE: ${{ runner.temp }}/autoflow-release.jks
          AUTOFLOW_STORE_PASSWORD: ${{ secrets.AUTOFLOW_STORE_PASSWORD }}
          AUTOFLOW_KEY_ALIAS: ${{ secrets.AUTOFLOW_KEY_ALIAS }}
          AUTOFLOW_KEY_PASSWORD: ${{ secrets.AUTOFLOW_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: List generated APK files
        run: ls -lah app/build/outputs/apk/release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
